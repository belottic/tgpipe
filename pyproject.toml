[project]
name = "tgpipe"
version = "0.1.0"
description = "Non-interactive Telegram command-line client for a personal account"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Camillo Belotti", email = "camillo.belotti@gmail.com" }]
keywords = ["telegram", "telethon", "cli", "mtproto", "automation", "export"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "telethon>=1.44,<2",
    "cryptg>=0.6",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "typer>=0.27",
    "qrcode>=8",
]

[project.urls]
Homepage = "https://github.com/belottic/tgpipe"
Repository = "https://github.com/belottic/tgpipe"
Issues = "https://github.com/belottic/tgpipe/issues"

[project.scripts]
tgpipe = "tgpipe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
